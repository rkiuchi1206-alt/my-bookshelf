<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マイ本棚</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=192&h=192&fit=crop">

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .aspect-cover { aspect-ratio: 1 / 1.5; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f2f2f7] text-gray-900 min-h-screen pb-24 select-none font-sans">

  <header class="sticky top-0 z-10 bg-[#f2f2f7]/90 backdrop-blur-xl px-5 pt-12 pb-3 flex justify-between items-end">
    <h1 class="text-2xl font-bold tracking-tight">本棚</h1>
    <div class="flex items-center space-x-3">
      <select id="sort-select" onchange="handleSortChange()" class="bg-white border-gray-200 rounded-lg px-2 py-1.5 text-xs font-semibold shadow-sm focus:outline-none text-gray-700">
        <option value="ADDED_DESC">追加順 (新)</option>
        <option value="ADDED_ASC">追加順 (古)</option>
        <option value="RATING_DESC">評価順</option>
        <option value="READ_DESC">読了日順</option>
      </select>
      <button onclick="openAddModal()" class="text-blue-500 font-semibold text-base hover:text-blue-700 transition">
        ＋ 追加
      </button>
    </div>
  </header>

  <section class="px-5 pt-2 pb-4 space-y-4">
    <div class="flex space-x-2 text-sm font-medium">
      <button onclick="setCategory('ALL')" id="cat-ALL" class="cat-btn px-4 py-1.5 rounded-full bg-black text-white shadow-sm">すべて</button>
      <button onclick="setCategory('STUDY')" id="cat-STUDY" class="cat-btn px-4 py-1.5 rounded-full bg-white text-gray-600 shadow-sm">勉強用</button>
      <button onclick="setCategory('HOBBY')" id="cat-HOBBY" class="cat-btn px-4 py-1.5 rounded-full bg-white text-gray-600 shadow-sm">趣味用</button>
    </div>
    <div class="flex space-x-5 text-sm overflow-x-auto no-scrollbar pb-1">
      <button onclick="setStatus('ALL')" id="stat-ALL" class="stat-btn pb-1 font-bold border-b-2 border-black text-black whitespace-nowrap">すべて</button>
      <button onclick="setStatus('WANT')" id="stat-WANT" class="stat-btn pb-1 font-medium text-gray-400 border-b-2 border-transparent whitespace-nowrap">読みたい</button>
      <button onclick="setStatus('UNREAD')" id="stat-UNREAD" class="stat-btn pb-1 font-medium text-gray-400 border-b-2 border-transparent whitespace-nowrap">積読</button>
      <button onclick="setStatus('READING')" id="stat-READING" class="stat-btn pb-1 font-medium text-gray-400 border-b-2 border-transparent whitespace-nowrap">読んでいる</button>
      <button onclick="setStatus('COMPLETED')" id="stat-COMPLETED" class="stat-btn pb-1 font-medium text-gray-400 border-b-2 border-transparent whitespace-nowrap">読了</button>
    </div>
  </section>

  <main class="px-5">
    <div id="books-grid" class="grid grid-cols-3 gap-x-4 gap-y-6 sm:grid-cols-4 md:grid-cols-5"></div>
    <div id="empty-state" class="hidden text-center py-20 text-gray-400 text-sm">
      <div class="text-4xl mb-3">📚</div>
      本がありません
    </div>
  </main>

  <div id="detail-modal" class="fixed inset-0 bg-black/60 z-40 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
    <div class="bg-white w-11/12 max-w-sm rounded-2xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] flex flex-col" id="detail-modal-content">
      <div class="relative w-full h-48 bg-gray-100 flex items-center justify-center p-4 shrink-0">
        <img id="detail-cover" src="" class="h-full object-contain drop-shadow-xl rounded-sm">
        <button onclick="closeDetailModal()" class="absolute top-3 right-3 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center text-lg font-bold backdrop-blur-sm">&times;</button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4">
        <div>
          <h2 id="detail-title" class="text-xl font-bold leading-tight"></h2>
          <p id="detail-author" class="text-sm text-gray-500 mt-1"></p>
        </div>
        
        <div class="flex space-x-2 text-xs font-semibold">
          <span id="detail-category" class="px-2 py-1 bg-gray-100 text-gray-600 rounded-md"></span>
          <span id="detail-status" class="px-2 py-1 bg-blue-50 text-blue-600 rounded-md"></span>
        </div>

        <div id="detail-rating-area" class="hidden pt-3 border-t border-gray-100">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-gray-500">評価</span>
            <span id="detail-rating-stars" class="text-lg tracking-widest text-yellow-400"></span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-gray-500">読了日</span>
            <span id="detail-readdate" class="font-medium text-gray-800"></span>
          </div>
        </div>

        <div id="detail-memo-area" class="hidden pt-3 border-t border-gray-100">
          <span class="text-xs font-bold text-gray-500 block mb-1">感想メモ</span>
          <p id="detail-memo" class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed"></p>
        </div>

        <div class="pt-4 border-t border-gray-100 flex justify-between items-center">
          <button onclick="deleteBook()" class="text-red-500 text-sm font-medium px-2 py-1">削除</button>
          <button onclick="editBook()" class="bg-black text-white text-sm font-bold px-5 py-2 rounded-full">編集する</button>
        </div>
      </div>
    </div>
  </div>

  <div id="form-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full sm:w-11/12 max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="form-modal-content">
      <div class="flex justify-between items-center mb-5">
        <h2 id="form-title" class="text-lg font-bold">本を登録</h2>
        <button onclick="closeFormModal()" class="text-blue-500 font-semibold text-sm">キャンセル</button>
      </div>

      <div id="search-section" class="mb-4 space-y-3">
        <div class="flex space-x-2">
          <input type="text" id="search-query" placeholder="本のタイトルを入力..." class="flex-1 bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button onclick="searchBooks()" class="bg-black text-white px-4 rounded-xl text-sm font-bold active:scale-95 transition">検索</button>
        </div>
        <div id="search-results" class="hidden space-y-2 max-h-48 overflow-y-auto bg-gray-50 p-2 rounded-xl"></div>
        <button onclick="showManualForm()" class="w-full text-center text-xs text-blue-500 font-semibold py-2">検索せず手動で入力する</button>
      </div>

      <form id="book-form" onsubmit="handleSaveBook(event)" class="space-y-4 hidden">
        <input type="hidden" id="input-id">
        <input type="hidden" id="input-cover">
        
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">タイトル *</label>
          <input type="text" id="input-title" required class="w-full bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">作者</label>
          <input type="text" id="input-author" class="w-full bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">カテゴリ</label>
            <select id="input-category" class="w-full bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="STUDY">勉強用</option>
              <option value="HOBBY">趣味用</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">ステータス</label>
            <select id="input-status" onchange="toggleCompletedFields()" class="w-full bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="WANT">読みたい</option>
              <option value="UNREAD">積読</option>
              <option value="READING">読んでいる</option>
              <option value="COMPLETED">読了</option>
            </select>
          </div>
        </div>

        <div id="completed-fields" class="hidden space-y-4 pt-2 border-t border-gray-100">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">評価 (1〜5)</label>
              <select id="input-rating" class="w-full bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-yellow-500">
                <option value="0" class="text-gray-900">未評価</option>
                <option value="1">★☆☆☆☆</option>
                <option value="2">★★☆☆☆</option>
                <option value="3">★★★☆☆</option>
                <option value="4">★★★★☆</option>
                <option value="5">★★★★★</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1">読了日</label>
              <input type="date" id="input-readdate" class="w-full bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
            </div>
          </div>
          <div class="flex items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
            <input type="checkbox" id="input-favorite" class="w-4 h-4 text-blue-600 bg-white border-gray-300 rounded focus:ring-blue-500">
            <label for="input-favorite" class="ml-2 text-xs font-bold text-gray-700">特にお気に入り🌟<br><span class="text-[10px] font-normal text-gray-500">※評価5の時のみ見た目が🌟になります</span></label>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">感想メモ</label>
            <textarea id="input-memo" rows="3" placeholder="感想を自由に書き込めます" class="w-full bg-gray-100 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </div>

        <div class="pt-4 flex space-x-2">
          <button type="button" id="back-to-search-btn" onclick="showSearchSection()" class="w-1/3 bg-gray-200 text-gray-700 rounded-xl font-bold p-3.5 active:scale-95 transition text-sm">戻る</button>
          <button type="submit" class="w-2/3 bg-black text-white rounded-xl font-bold p-3.5 shadow-lg active:scale-95 transition text-sm">保存する</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    // --- データ管理 ---
    let books = JSON.parse(localStorage.getItem('myBooks')) || [];
    function saveData() { localStorage.setItem('myBooks', JSON.stringify(books)); }

    // --- 状態管理 ---
    let currentCategory = 'ALL';
    let currentStatus = 'ALL';
    let currentSort = 'ADDED_DESC'; // 追加順(新)をデフォルトに
    let viewingBookId = null;

    const STATUS_LABELS = { WANT: '読みたい', UNREAD: '積読', READING: '読んでいる', COMPLETED: '読了' };
    const CATEGORY_LABELS = { STUDY: '勉強用', HOBBY: '趣味用' };

    // --- 描画処理（並び替え機能追加） ---
    function renderBooks() {
      const grid = document.getElementById('books-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      // 1. フィルター
      let filtered = books.filter(b => {
        return (currentCategory === 'ALL' || b.category === currentCategory) && 
               (currentStatus === 'ALL' || b.status === currentStatus);
      });

      // 2. 並び替え（ソート）
      filtered.sort((a, b) => {
        if (currentSort === 'ADDED_DESC') return b.id - a.id;
        if (currentSort === 'ADDED_ASC') return a.id - b.id;
        if (currentSort === 'RATING_DESC') {
          // お気に入りフラグがある5点は、通常の5点より上にくるように微調整
          const scoreA = (a.rating || 0) + (a.favorite && a.rating == 5 ? 0.1 : 0);
          const scoreB = (b.rating || 0) + (b.favorite && b.rating == 5 ? 0.1 : 0);
          return scoreB - scoreA;
        }
        if (currentSort === 'READ_DESC') {
          const dateA = a.readdate ? new Date(a.readdate).getTime() : 0;
          const dateB = b.readdate ? new Date(b.readdate).getTime() : 0;
          return dateB - dateA;
        }
        return 0;
      });

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        filtered.forEach(book => {
          const card = document.createElement('div');
          card.className = "flex flex-col space-y-2 cursor-pointer group";
          card.onclick = () => openDetailModal(book.id);
          
          // 読了本のみ、表紙に評価バッジを小さく表示
          let badgeHTML = '';
          if (book.status === 'COMPLETED' && book.rating > 0) {
            const icon = (book.rating == 5 && book.favorite) ? '🌟' : '★';
            badgeHTML = `<div class="absolute top-1.5 right-1.5 bg-black/80 text-white text-[9px] px-1.5 py-0.5 rounded shadow-sm font-bold tracking-widest">${icon}${book.rating}</div>`;
          }

          card.innerHTML = `
            <div class="w-full aspect-cover bg-gray-200 rounded-md overflow-hidden shadow-[2px_4px_12px_rgba(0,0,0,0.1)] group-active:scale-95 transition transform relative">
              <img src="${book.cover}" class="w-full h-full object-cover">
              ${badgeHTML}
            </div>
            <div class="px-0.5">
              <p class="text-[13px] font-bold leading-tight line-clamp-2 text-gray-900">${book.title}</p>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    function handleSortChange() {
      currentSort = document.getElementById('sort-select').value;
      renderBooks();
    }

    // --- フィルター操作 ---
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.className = 'cat-btn px-4 py-1.5 rounded-full bg-white text-gray-600 shadow-sm');
      document.getElementById(`cat-${cat}`).className = 'cat-btn px-4 py-1.5 rounded-full bg-black text-white shadow-sm';
      renderBooks();
    }
    function setStatus(stat) {
      currentStatus = stat;
      document.querySelectorAll('.stat-btn').forEach(btn => btn.className = 'stat-btn pb-1 font-medium text-gray-400 border-b-2 border-transparent whitespace-nowrap');
      document.getElementById(`stat-${stat}`).className = 'stat-btn pb-1 font-bold border-b-2 border-black text-black whitespace-nowrap';
      renderBooks();
    }

    // --- 詳細モーダル ---
    function openDetailModal(id) {
      viewingBookId = id;
      const book = books.find(b => b.id === id);
      document.getElementById('detail-cover').src = book.cover;
      document.getElementById('detail-title').innerText = book.title;
      document.getElementById('detail-author').innerText = book.author || '作者不明';
      document.getElementById('detail-category').innerText = CATEGORY_LABELS[book.category];
      document.getElementById('detail-status').innerText = STATUS_LABELS[book.status];
      
      const ratingArea = document.getElementById('detail-rating-area');
      const memoArea = document.getElementById('detail-memo-area');

      // 読了ステータスの時だけ評価・読了日・感想を表示
      if (book.status === 'COMPLETED') {
        ratingArea.classList.remove('hidden');
        let stars = '';
        if (book.rating > 0) {
          if (book.rating == 5 && book.favorite) {
            stars = '🌟🌟🌟🌟🌟';
          } else {
            stars = '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating);
          }
        } else {
          stars = '<span class="text-gray-400 text-sm">未評価</span>';
        }
        document.getElementById('detail-rating-stars').innerHTML = stars;
        document.getElementById('detail-readdate').innerText = book.readdate ? book.readdate.replace(/-/g, '/') : '未設定';

        if (book.memo) {
          memoArea.classList.remove('hidden');
          document.getElementById('detail-memo').innerText = book.memo;
        } else {
          memoArea.classList.add('hidden');
        }
      } else {
        ratingArea.classList.add('hidden');
        memoArea.classList.add('hidden');
      }
      
      const modal = document.getElementById('detail-modal');
      const content = document.getElementById('detail-modal-content');
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
    }
    
    function closeDetailModal() {
      const modal = document.getElementById('detail-modal');
      const content = document.getElementById('detail-modal-content');
      modal.classList.add('opacity-0'); content.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
      viewingBookId = null;
    }

    // --- 検索＆追加モーダル ---
    function toggleCompletedFields() {
      const status = document.getElementById('input-status').value;
      const fields = document.getElementById('completed-fields');
      if (status === 'COMPLETED') {
        fields.classList.remove('hidden');
      } else {
        fields.classList.add('hidden');
      }
    }

    function openAddModal() {
      document.getElementById('form-title').innerText = '本を検索して登録';
      document.getElementById('search-query').value = '';
      document.getElementById('search-results').classList.add('hidden');
      showSearchSection();
      
      const modal = document.getElementById('form-modal');
      const content = document.getElementById('form-modal-content');
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); if(window.innerWidth<640) content.classList.remove('translate-y-full'); }, 10);
    }
    
    function closeFormModal() {
      const modal = document.getElementById('form-modal');
      const content = document.getElementById('form-modal-content');
      modal.classList.add('opacity-0'); if(window.innerWidth<640) content.classList.add('translate-y-full');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function showSearchSection() {
      document.getElementById('search-section').classList.remove('hidden');
      document.getElementById('book-form').classList.add('hidden');
    }
    
    function showManualForm() {
      document.getElementById('search-section').classList.add('hidden');
      document.getElementById('book-form').classList.remove('hidden');
      document.getElementById('back-to-search-btn').classList.remove('hidden');
      if(!document.getElementById('input-id').value) {
        document.getElementById('book-form').reset();
        toggleCompletedFields();
      }
    }

    // 🍎ハイブリッド検索処理（Google Books → ダメなら Apple Books）
    async function searchBooks() {
      const query = document.getElementById('search-query').value;
      if (!query) return;
      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '<p class="text-xs text-center text-gray-500 py-3">Googleで検索中...</p>';
      resultsDiv.classList.remove('hidden');

      let foundBooks = [];

      try {
        // 1. まずGoogle Books APIで検索
        const googleRes = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=5`);
        const googleData = await googleRes.json();
        
        if (googleData.items && googleData.items.length > 0) {
          foundBooks = googleData.items.map(item => {
            const info = item.volumeInfo;
            return {
              title: info.title || 'タイトル不明',
              author: info.authors ? info.authors.join(', ') : '',
              cover: info.imageLinks ? info.imageLinks.thumbnail.replace('http:', 'https:') : ''
            };
          });
        }
      } catch (err) {
        console.log('Google API Error:', err);
      }

      // 2. Googleで見つからなかったり通信ブロックされた場合、Apple Booksで再検索！
      if (foundBooks.length === 0) {
        resultsDiv.innerHTML = '<p class="text-xs text-center text-gray-500 py-3">Appleのシステムで再検索中...</p>';
        try {
          const appleRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&country=jp&entity=ebook&limit=5`);
          const appleData = await appleRes.json();
          
          if (appleData.results && appleData.results.length > 0) {
            foundBooks = appleData.results.map(item => {
              return {
                title: item.trackName || 'タイトル不明',
                author: item.artistName || '',
                // Appleの小さな画像をきれいなサイズに置換
                cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : ''
              };
            });
          }
        } catch (err) {
          console.log('Apple API Error:', err);
        }
      }

      // 3. 結果の表示
      resultsDiv.innerHTML = '';
      if (foundBooks.length === 0) {
        resultsDiv.innerHTML = '<p class="text-xs text-center text-red-500 py-3">見つかりませんでした。<br>作者名を追加してみてください。</p>';
        return;
      }

      foundBooks.forEach(book => {
        const div = document.createElement('div');
        div.className = "flex items-center p-2 bg-white rounded-lg shadow-sm border border-gray-100 cursor-pointer active:bg-gray-50";
        div.onclick = () => selectBookFromSearch(book.title, book.author, book.cover);
        div.innerHTML = `
          <div class="w-10 h-14 bg-gray-200 rounded flex-shrink-0 mr-3 overflow-hidden">
            ${book.cover ? `<img src="${book.cover}" class="w-full h-full object-cover">` : ''}
          </div>
          <div class="overflow-hidden">
            <p class="text-xs font-bold text-gray-900 truncate">${book.title}</p>
            <p class="text-[10px] text-gray-500 truncate">${book.author}</p>
          </div>
        `;
        resultsDiv.appendChild(div);
      });
    }

    function selectBookFromSearch(title, author, coverUrl) {
      document.getElementById('input-id').value = '';
      document.getElementById('input-title').value = title;
      document.getElementById('input-author').value = author;
      document.getElementById('input-cover').value = coverUrl;
      showManualForm();
    }

    function editBook() {
      const book = books.find(b => b.id === viewingBookId);
      document.getElementById('input-id').value = book.id;
      document.getElementById('input-title').value = book.title;
      document.getElementById('input-author').value = book.author;
      document.getElementById('input-cover').value = book.cover.includes('unsplash') ? '' : book.cover;
      document.getElementById('input-category').value = book.category;
      document.getElementById('input-status').value = book.status;
      
      document.getElementById('input-rating').value = book.rating || 0;
      document.getElementById('input-readdate').value = book.readdate || '';
      document.getElementById('input-favorite').checked = book.favorite || false;
      document.getElementById('input-memo').value = book.memo || '';
      
      document.getElementById('form-title').innerText = '本を編集';
      document.getElementById('search-section').classList.add('hidden');
      document.getElementById('book-form').classList.remove('hidden');
      document.getElementById('back-to-search-btn').classList.add('hidden');
      
      toggleCompletedFields(); // 読了の場合のみ追加項目を表示
      closeDetailModal();
      
      setTimeout(() => {
        const modal = document.getElementById('form-modal');
        const content = document.getElementById('form-modal-content');
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); if(window.innerWidth<640) content.classList.remove('translate-y-full'); }, 10);
      }, 300);
    }

    function handleSaveBook(e) {
      e.preventDefault();
      const id = document.getElementById('input-id').value;
      const status = document.getElementById('input-status').value;
      
      if (status === 'READING') {
        const readingCount = books.filter(b => b.status === 'READING' && b.id !== id).length;
        if (readingCount >= 3) {
          alert('「読んでいる」本は最大3冊までしか登録できません。');
          return;
        }
      }

      const defaultCover = 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=300&fit=crop';
      const bookData = {
        title: document.getElementById('input-title').value,
        author: document.getElementById('input-author').value,
        cover: document.getElementById('input-cover').value || defaultCover,
        category: document.getElementById('input-category').value,
        status: status,
        rating: parseInt(document.getElementById('input-rating').value) || 0,
        readdate: document.getElementById('input-readdate').value || '',
        favorite: document.getElementById('input-favorite').checked,
        memo: document.getElementById('input-memo').value || ''
      };

      if (id) {
        const index = books.findIndex(b => b.id === id);
        books[index] = { ...books[index], ...bookData };
      } else {
        bookData.id = Date.now().toString();
        books.unshift(bookData);
      }

      saveData();
      renderBooks();
      closeFormModal();
    }

    function deleteBook() {
      if (confirm('この本を本棚から削除しますか？')) {
        books = books.filter(b => b.id !== viewingBookId);
        saveData();
        renderBooks();
        closeDetailModal();
      }
    }

    renderBooks();
  </script>
</body>
</html>
